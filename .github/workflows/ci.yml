name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The repository is ~1.6 GB, almost all of it pictures. Every job checks out
# only what it needs (blob:none + sparse checkout); file existence checks use
# `git ls-files`, which sees the whole tree without downloading it.
env:
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/img/
            !/public/images/
            !/public/data/
            !/output/
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npx eslint . --max-warnings 26
      - name: JSON config files parse
        run: |
          for f in package.json vercel.json public/manifest.webmanifest series.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "✔ $f"
          done

  test:
    name: Unit tests (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24, 26]
        include:
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/img/
            !/public/images/
            !/public/data/
            !/output/
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  data:
    name: Site data integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          # Every series index, but not the chapter text or pictures.
          sparse-checkout: |
            /*
            !/public/img/
            !/public/images/
            !/output/
            !/public/data/**/vol-*.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check-data

  e2e:
    name: Browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          # The shelf, Thiên Sứ Nhà Bên (chapter text included) and one
          # Tủ Sách 1000 book; pictures are left out.
          sparse-checkout: |
            /*
            !/public/img/
            !/public/images/
            !/output/
            !/public/data/*/
            /public/data/b1k-1922-nam-ac-bao/
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-screenshots
          path: e2e-screenshots/
          if-no-files-found: ignore
          retention-days: 14
